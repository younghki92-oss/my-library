<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Library</title>
<meta name="theme-color" content="#F3F4F7" id="themeColor">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: library = shelf of covers under a "continue" card; reader = full-bleed page with overlay chrome that hides while reading; panels slide from the right (desktop) or up from the bottom (phone). */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#1D2130; --muted:#646B80; --line:#DDE0E8;
  --accent:#3446A8; --accent-ink:#FFFFFF; --accent-soft:rgba(52,70,168,.12); --ribbon:#B23A3E;
  --scrim:rgba(18,20,28,.34); --shadow:0 1px 2px rgba(20,24,40,.06),0 10px 28px rgba(20,24,40,.10);
  --hl-yellow:rgba(255,200,40,.42); --hl-green:rgba(80,190,110,.34); --hl-blue:rgba(80,140,255,.30); --hl-pink:rgba(255,100,145,.30); --hl-purple:rgba(150,100,240,.30); --hl-orange:rgba(255,145,50,.36); --ul-red:#E5484D;
  /* reading surface ("자동" theme) */
  --r-bg:#FCFCFA; --r-fg:#23262F; --r-muted:#7A8091; --r-rule:#E4E6EC; --r-panel:#FFFFFF; --r-link:#3446A8;
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13151B; --surface:#1B1E26; --ink:#E7E9F0; --muted:#9298AC; --line:#2B2F3C;
  --accent:#8E9BFF; --accent-ink:#11131A; --accent-soft:rgba(142,155,255,.16); --ribbon:#E26A6E;
  --scrim:rgba(0,0,0,.5); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  --r-bg:#16181D; --r-fg:#CDD0D8; --r-muted:#80869A; --r-rule:#2A2D36; --r-panel:#1C1F26; --r-link:#9EAAFF;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#13151B; --surface:#1B1E26; --ink:#E7E9F0; --muted:#9298AC; --line:#2B2F3C;
  --accent:#8E9BFF; --accent-ink:#11131A; --accent-soft:rgba(142,155,255,.16); --ribbon:#E26A6E;
  --scrim:rgba(0,0,0,.5); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  --r-bg:#16181D; --r-fg:#CDD0D8; --r-muted:#80869A; --r-rule:#2A2D36; --r-panel:#1C1F26; --r-link:#9EAAFF;
  color-scheme:dark }
#reader[data-rt="paper"]{ --r-bg:#FFFFFF; --r-fg:#202329; --r-muted:#7A8091; --r-rule:#E6E8ED; --r-panel:#FFFFFF; --r-link:#3446A8; --accent:#3446A8; --accent-ink:#fff; --accent-soft:rgba(52,70,168,.12); --ribbon:#B23A3E; color-scheme:light }
#reader[data-rt="sepia"]{ --r-bg:#F2E9D8; --r-fg:#4A3B2A; --r-muted:#8C7A62; --r-rule:#DFD2BA; --r-panel:#F7F0E2; --r-link:#7A4A1E; --accent:#8A5526; --accent-ink:#fff; --accent-soft:rgba(138,85,38,.14); --ribbon:#A63A2E; color-scheme:light }
#reader[data-rt="night"]{ --r-bg:#0F1114; --r-fg:#B9BDC6; --r-muted:#737987; --r-rule:#24272E; --r-panel:#171A1F; --r-link:#9EAAFF; --accent:#8E9BFF; --accent-ink:#0F1114; --accent-soft:rgba(142,155,255,.16); --ribbon:#D9625F; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--ribbon);border-color:var(--ribbon);color:#fff}
.btn svg.i{width:18px;height:18px}

/* ---------- library ---------- */
#library{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
#side{position:sticky;top:0;height:100vh;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:calc(env(safe-area-inset-top,0px) + 22px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;z-index:15}
#side .brand{padding:0 8px 14px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 10px;margin:0 2px 10px}
.search svg{width:17px;height:17px;flex:none;color:var(--muted);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;padding:9px 0;outline:none}
.side-h{margin:16px 10px 4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.side-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);font:inherit;font-size:14.5px;padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left}
.side-item svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.side-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-item .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-item:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.side-item[aria-current="true"]{background:color-mix(in srgb,var(--ink) 10%,transparent);font-weight:600}
.side-item.drop-on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.side-item.add{color:var(--muted)}
.side-foot .ver{font-size:11px;color:var(--muted);padding-left:6px;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#libMain{min-width:0;padding-inline:clamp(16px,4vw,48px);padding-block:calc(env(safe-area-inset-top,0px) + 26px) 56px}
.main-head{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.main-head h1{margin:0;font-family:var(--f-display);font-size:clamp(26px,4vw,38px);font-weight:700;letter-spacing:-.01em}
.main-head #count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.main-head .acts{margin-left:auto;display:flex;gap:6px}
.main-head .acts .btn{padding:6px 12px;font-size:13px}
#sideToggle{display:none;width:40px;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer}
#sideToggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
#sideScrim{display:none}
@media (max-width:759px){
  #library{grid-template-columns:minmax(0,1fr)}
  #side{position:fixed;left:0;top:0;bottom:0;width:min(280px,84vw);height:auto;transform:translateX(-102%);transition:transform .25s ease;box-shadow:var(--shadow)}
  #library.side-open #side{transform:none}
  #library.side-open #sideScrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:14}
  #sideToggle{display:inline-flex;align-items:center;justify-content:center}
}
.cover img{-webkit-user-drag:none;user-select:none}
/* a corner ribbon marks PDFs on the shelf */
.pdf-band{position:absolute;top:9%;right:-34%;width:100%;transform:rotate(45deg);background:#B23A3E;color:#fff;font:700 clamp(8px,1.1vw,11px)/1 var(--f-ui);letter-spacing:.14em;text-align:center;padding:4px 0;box-shadow:0 1px 4px rgba(0,0,0,.35);z-index:2;pointer-events:none}
.drag-ghost .cover{width:64px}
.drag-ghost{position:fixed;z-index:80;width:64px;pointer-events:none;transform:translate(-50%,-60%) rotate(-4deg);opacity:.92;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.card.dragging{opacity:.4}
.cover-btn{touch-action:pan-y;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.col-checks{border:0;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:2px}
.col-checks legend{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px;padding:0}
.col-checks label{flex-direction:row;align-items:center;gap:10px;margin:0;padding:6px 2px;font-size:14.5px;color:var(--ink);font-weight:400}
.col-checks input{width:18px;height:18px;accent-color:var(--accent)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.01em}
.brand .mark{width:22px;height:28px;border:1.5px solid currentColor;border-radius:2px;position:relative}
.brand .mark::after{content:"";position:absolute;inset:5px 5px 9px 5px;border-top:1.5px solid currentColor;border-bottom:1.5px solid currentColor;opacity:.55}
.continue{display:flex;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:36px}
.continue .cover{width:92px;flex:none}
.continue .txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.continue h2{margin:0;font-family:var(--f-display);font-size:clamp(19px,3vw,24px);line-height:1.3;text-wrap:balance}
.continue .sub{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.continue .btn{align-self:flex-start;margin-top:6px}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.shelf-head{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.shelf-head h2{margin:0;font-size:15px;font-weight:600}
.shelf-head span{color:var(--muted);font-size:13px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:34px 26px}
@media (max-width:520px){ #grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 14px} .continue{gap:14px;padding:14px} .continue .cover{width:70px} }
.card{position:relative;min-width:0;display:flex;flex-direction:column;gap:8px}
.cover-btn{display:block;border:0;padding:0;background:none;cursor:pointer;border-radius:3px 6px 6px 3px}
.cover{aspect-ratio:2/3;max-width:100%;border-radius:3px 6px 6px 3px;overflow:hidden;box-shadow:var(--shadow);position:relative;background:#2E3A6B}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.08) 5%,transparent 9%);pointer-events:none}
.cover.gen{display:flex;flex-direction:column;justify-content:space-between;padding:14px 11px 11px 15px;color:#F3F0E8;box-sizing:border-box}
.cover.gen .t{font-family:var(--f-display);font-weight:700;font-size:clamp(12px,1.6vw,16px);line-height:1.3;word-break:keep-all;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.cover.gen .a{font-size:10.5px;opacity:.75;border-top:1px solid rgba(243,240,232,.4);padding-top:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card h3{margin:0;font-size:13.5px;font-weight:500;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all}
.card-foot{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;gap:6px}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.more{border:0;background:none;padding:2px 4px;border-radius:6px;cursor:pointer;color:var(--muted);line-height:1}
.more:hover{background:var(--line)}
.confirm{position:absolute;inset:0;background:color-mix(in srgb,var(--surface) 94%,transparent);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;font-size:13px;padding:8px;border:1px solid var(--line)}
.confirm div{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.confirm .btn{padding:6px 12px;font-size:13px}
.hint{color:var(--muted);font-size:13px;margin-top:40px;line-height:1.6}
.card-foot .foot-txt{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-dlg select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14.5px;background:var(--bg);color:var(--ink)}
.cat-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.cat-row span.n{flex:1}
.cat-row small{color:var(--muted);font-size:12px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.dict-syn{font-size:14px;line-height:1.6;color:var(--r-fg)}
.drive-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:13px;color:var(--ink);white-space:nowrap}
.drive-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.drive-chip.ok .dot{background:#3FA66B} .drive-chip.busy .dot{background:var(--accent);animation:blink 1s steps(2) infinite} .drive-chip.err .dot{background:var(--ribbon)}
@keyframes blink{50%{opacity:.25}}
.cloud{font-size:11px;color:var(--muted)}
.card.loading .cover-btn{opacity:.55}
dialog.lib-dlg{border:0;border-radius:16px;background:var(--surface);color:var(--ink);padding:22px;width:min(440px,calc(100% - 32px));box-shadow:var(--shadow);box-sizing:border-box}
dialog.lib-dlg::backdrop{background:var(--scrim)}
.lib-dlg h2{margin:0 0 6px;font-size:18px}
.lib-dlg p.sub{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.55}
.lib-dlg label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:14px}
.lib-dlg input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14.5px;background:var(--bg);color:var(--ink)}
.lib-dlg small{color:var(--muted);font-size:12px;line-height:1.5;font-weight:400}
.lib-dlg details{margin-bottom:14px;font-size:13px;color:var(--muted)}
.lib-dlg summary{cursor:pointer;margin-bottom:10px}
.dlg-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:6px}
.dlg-acts .left{margin-right:auto}
.toast-act{margin-left:10px;border:0;background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
#toast.has-act{pointer-events:auto}
#drop{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:18px;background:color-mix(in srgb,var(--bg) 88%,transparent);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--accent);z-index:50;pointer-events:none}

/* ---------- reader ---------- */
#reader{position:fixed;inset:0;overscroll-behavior:none;background:var(--r-bg);color:var(--r-fg);overflow:hidden;--mx:clamp(20px,6vw,64px);--maxw:36em;z-index:10}
#reader.spread{--maxw:76em}
#stage{position:absolute;inset:0;touch-action:pan-y pinch-zoom}
#reader.scroll #stage{touch-action:auto}
#page{position:absolute;top:calc(env(safe-area-inset-top,0px) + 46px);bottom:calc(env(safe-area-inset-bottom,0px) + 42px);left:max(var(--mx),calc((100% - var(--maxw)) / 2));right:max(var(--mx),calc((100% - var(--maxw)) / 2));overflow:hidden;font-size:var(--r-size,19px)}
#reader.scroll #page{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
#content{font-family:var(--r-font);font-size:var(--r-size,19px);line-height:var(--r-lh,1.8);color:var(--r-fg);word-break:keep-all;overflow-wrap:break-word;orphans:2;widows:2;will-change:transform}
#content p{margin:0 0 .85em}
#content.justify{word-break:normal;line-break:strict}
#content.justify p,#content.justify li{text-align:justify}
#content h1,#content h2,#content h3,#content h4{font-weight:700;line-height:1.4;break-after:avoid;text-wrap:balance;margin:1.2em 0 .7em}
#content h1{font-size:1.45em;margin-top:.4em}
#content h2{font-size:1.2em}
#content h3,#content h4{font-size:1.05em}
#content > :first-child{margin-top:0}
#content img,#content svg{max-width:100%;height:auto;max-height:calc(var(--page-h,80vh) * .94);object-fit:contain;display:block;margin:.6em auto;break-inside:avoid}
#content blockquote{margin:1.1em 0;padding-left:1em;border-left:2px solid var(--r-rule);color:var(--r-muted)}
#content a{color:var(--r-link);text-decoration-thickness:1px;text-underline-offset:.18em}
#content table{border-collapse:collapse;font-size:.9em}
#content td,#content th{border:1px solid var(--r-rule);padding:.3em .5em}
#content pre{white-space:pre-wrap;font-size:.85em}
#content hr{border:0;border-top:1px solid var(--r-rule);margin:1.5em 20%}
/* on dark pages a see-through tint turns muddy (yellow becomes brown): use a real highlighter there, with dark ink */
#reader.darkpage{--hl-yellow:rgba(250,206,40,.86);--hl-green:rgba(112,206,140,.82);--hl-blue:rgba(122,170,255,.82);--hl-pink:rgba(255,135,172,.82);--hl-purple:rgba(182,146,255,.82);--hl-orange:rgba(255,168,88,.84);--hl-ink:#14161B}
mark.ann.hl{color:var(--hl-ink,inherit)}
mark.ann{color:inherit;background:transparent;border-radius:2px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.hl.c-yellow{background:var(--hl-yellow)} mark.hl.c-green{background:var(--hl-green)} mark.hl.c-blue{background:var(--hl-blue)} mark.hl.c-pink{background:var(--hl-pink)} mark.hl.c-purple{background:var(--hl-purple)} mark.hl.c-orange{background:var(--hl-orange)}
mark.ul{text-decoration:underline;text-decoration-color:var(--ul-red);text-decoration-thickness:2px;text-underline-offset:.24em;text-decoration-skip-ink:none}
mark.ann.has-note{border-bottom:1.5px dotted var(--r-muted)}
.handle{position:absolute;z-index:7;width:30px;touch-action:none;cursor:ew-resize}
.handle::before{content:"";position:absolute;top:10px;bottom:10px;width:6px;border:2.5px solid var(--accent)}
.handle::after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:var(--accent)}
.hs::before{left:13px;border-right:0;border-radius:3px 0 0 3px}
.hs::after{left:9.5px;top:0}
.he::before{right:13px;border-left:0;border-radius:0 3px 3px 0}
.he::after{right:9.5px;bottom:0}
#reader.dragging .handle{pointer-events:none}
#reader.dragging #content{-webkit-user-select:none;user-select:none}
mark.flash{background:var(--accent-soft);color:inherit;outline:2px solid var(--accent);border-radius:2px;animation:flash 2.4s ease-out forwards}
@keyframes flash{70%{outline-color:var(--accent)}100%{outline-color:transparent;background:transparent}}
#sentinel{display:block;height:0}
.ch-end{display:flex;justify-content:center;padding-block:2em 3em}
.ch-end .btn{background:transparent;border-color:var(--r-rule);color:var(--r-fg)}

#running,#foot{position:absolute;left:max(var(--mx),calc((100% - var(--maxw)) / 2));right:max(var(--mx),calc((100% - var(--maxw)) / 2));display:flex;justify-content:space-between;gap:16px;color:var(--r-muted);font-size:12px;pointer-events:none;font-variant-numeric:tabular-nums}
#running{top:calc(env(safe-area-inset-top,0px) + 16px);justify-content:center}
#running span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#foot{bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
#ribbon{position:absolute;top:0;right:max(calc(var(--mx) - 34px),8px);width:16px;height:46px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);pointer-events:none;animation:drop .3s ease-out}
@keyframes drop{from{transform:translateY(-100%)}}

.chrome{position:absolute;left:0;right:0;z-index:5;background:color-mix(in srgb,var(--r-bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .26s ease,opacity .26s ease}
#topbar{top:0;display:flex;align-items:center;gap:2px;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 6px;border-bottom:1px solid var(--r-rule)}
#bottombar{bottom:0;padding:12px max(16px,var(--mx)) calc(env(safe-area-inset-bottom,0px) + 14px);border-top:1px solid var(--r-rule);display:flex;flex-direction:column;gap:8px}
#reader.ui-hidden #topbar{transform:translateY(-100%);opacity:0;pointer-events:none}
#reader.ui-hidden #bottombar{transform:translateY(100%);opacity:0;pointer-events:none}
.ib{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--r-fg);flex:none}
.ib:hover{background:color-mix(in srgb,var(--r-fg) 8%,transparent)}
.ib[aria-pressed="true"]{color:var(--ribbon)}
.ib[aria-pressed="true"] svg{fill:currentColor}
.ib .ga{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1}
.tb-title{flex:1;min-width:0;padding-inline:6px;display:flex;flex-direction:column}
.tb-title b{font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb-title span{font-size:12px;color:var(--r-muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.seek-row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--r-muted);font-variant-numeric:tabular-nums}
.seek-row b{color:var(--r-fg);font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}

#scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#sheet{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);z-index:21;background:var(--r-panel);color:var(--r-fg);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:slideR .24s cubic-bezier(.2,.7,.2,1)}
@keyframes slideR{from{transform:translateX(100%)}}
@media (max-width:640px){ #sheet{top:auto;left:0;width:100%;max-height:82%;border-radius:18px 18px 0 0;padding-top:0;padding-bottom:env(safe-area-inset-bottom,0px);animation-name:slideU} }
@keyframes slideU{from{transform:translateY(100%)}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 20px;border-bottom:1px solid var(--r-rule)}
.sheet-head h2{margin:0;font-size:16px;font-weight:600;flex:1}
#sheetBody{overflow-y:auto;padding:12px 20px 24px;flex:1;overscroll-behavior:contain}
.toc-list{list-style:none;margin:0;padding:0}
.toc-list button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 10px;border-radius:8px;cursor:pointer;font-size:14.5px;line-height:1.4;color:var(--r-fg)}
.toc-list button:hover{background:color-mix(in srgb,var(--r-fg) 6%,transparent)}
.toc-list button[aria-current="true"]{color:var(--accent);font-weight:600;background:var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:10px;padding-block:14px;border-bottom:1px solid var(--r-rule)}
.field:last-child{border-bottom:0}
.field > label,.field > .lbl{font-size:12.5px;color:var(--r-muted);font-weight:500;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;border:1px solid var(--r-rule);background:transparent;border-radius:10px;padding:9px 6px;cursor:pointer;font-size:13.5px;color:var(--r-fg)}
.seg button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);font-weight:600}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px}
.swatch i{width:34px;height:34px;border-radius:50%;border:1px solid rgba(128,128,128,.35);display:block}
.fontbtn{display:flex!important;flex-direction:column;gap:2px;align-items:center}
.fontbtn b{font-size:18px;font-weight:400}
.fontbtn small{font-size:11.5px;color:var(--r-muted)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:38px;border:1px solid var(--r-rule);background:transparent;border-radius:10px;cursor:pointer;color:var(--r-fg);font-size:16px}
.stepper output{flex:1;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.search-in{width:100%;box-sizing:border-box;border:1px solid var(--r-rule);background:var(--r-bg);color:var(--r-fg);border-radius:10px;padding:11px 14px;font:inherit;font-size:15px}
.results{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.results button{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--r-rule);background:none;padding:12px 4px;cursor:pointer;color:var(--r-fg)}
.results small{color:var(--r-muted);font-size:12px}
.results span{font-size:14px;line-height:1.55}
.results mark{background:var(--hl-yellow);color:inherit;border-radius:2px}
.empty{color:var(--r-muted);font-size:14px;line-height:1.6;padding:16px 4px}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--r-muted)}
.tabs button[aria-selected="true"]{color:var(--r-fg);background:color-mix(in srgb,var(--r-fg) 7%,transparent);font-weight:600}
.note-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--r-rule)}
.note-item .sw{width:4px;border-radius:2px;flex:none}
.note-item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.note-item .q{all:unset;cursor:pointer;font-family:var(--r-font);font-size:14.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.note-item .n{font-size:13.5px;color:var(--r-fg);background:color-mix(in srgb,var(--r-fg) 5%,transparent);padding:8px 10px;border-radius:8px;white-space:pre-wrap}
.note-item .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--r-muted)}
.note-item .meta button{border:0;background:none;color:var(--r-muted);cursor:pointer;font-size:12px;padding:4px}
.memo-quote{margin:4px 0 14px;padding-left:12px;border-left:3px solid var(--hl-yellow);font-family:var(--r-font);line-height:1.6;color:var(--r-muted)}
#memoText{width:100%;box-sizing:border-box;min-height:140px;border:1px solid var(--r-rule);border-radius:10px;padding:12px;font:inherit;font-size:15px;line-height:1.6;background:var(--r-bg);color:var(--r-fg);resize:vertical}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}

/* PDF pages */
.pdf-wrap{display:flex;justify-content:center;align-items:flex-start;gap:16px;min-height:100%}
#reader.pdf:not(.fitw) .pdf-wrap{align-items:center;height:100%}
.pdf-page{position:relative;flex:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18),0 6px 20px rgba(0,0,0,.12)}
.pdf-page canvas{position:absolute;inset:0;width:100%;height:100%}
.pdf-marks{position:absolute;inset:0;z-index:1;pointer-events:none}
.pmark{position:absolute;border-radius:2px;mix-blend-mode:multiply}
.pmark.hl.c-yellow{background:rgba(255,200,40,.45)} .pmark.hl.c-green{background:rgba(80,190,110,.38)} .pmark.hl.c-blue{background:rgba(80,140,255,.34)}
.pmark.hl.c-pink{background:rgba(255,100,145,.34)} .pmark.hl.c-purple{background:rgba(150,100,240,.34)} .pmark.hl.c-orange{background:rgba(255,145,50,.4)}
.pmark.ul{background:none;border-bottom:2px solid var(--ul-red);border-radius:0;mix-blend-mode:normal}
.pmark.has-note{box-shadow:inset 0 -1.5px 0 rgba(0,0,0,.45)}
.pmark.pend{background:var(--accent-soft);outline:1.5px dashed var(--accent);mix-blend-mode:normal}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;opacity:1;text-align:initial;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2;word-break:normal}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.textLayer.selecting .endOfContent{top:0}
.textLayer br::selection{background:transparent}
.textLayer ::selection{background:rgba(52,70,168,.28)}
#reader.pdf #page{overflow:hidden}
#reader.pdf.fitw #page{overflow-y:auto;overscroll-behavior:contain}
.pdf-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px}
#selbar{position:fixed;z-index:30;display:flex;flex-direction:column;gap:3px;padding:5px;border-radius:12px;background:var(--r-fg);color:var(--r-bg);box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .15s}
#selbar button{border:0;background:none;color:inherit;cursor:pointer;height:36px;min-width:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;padding:0 8px}
#selbar button:hover{background:color-mix(in srgb,var(--r-bg) 16%,transparent)}
#selbar .dot{width:20px;height:20px;border-radius:50%;display:block}
#selbar .sep{width:1px;height:20px;background:color-mix(in srgb,var(--r-bg) 30%,transparent);margin:0 4px}
.sb-row{display:flex;align-items:center;gap:2px}
.sb-sub{border-top:1px solid color-mix(in srgb,var(--r-bg) 22%,transparent);padding-top:3px;justify-content:space-between}
.sb-sub button{flex:1;white-space:nowrap}
mark.pend{background:var(--hl-yellow);color:inherit;outline:1.5px dashed var(--accent);outline-offset:1px;border-radius:2px}
/* touch: the reader does its own selection (no Android selection toolbar) */
#reader.touchsel #content{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#reader.touchsel.tsel-on #content{-webkit-user-select:text;user-select:text}
.tsel-rect{position:fixed;z-index:4;background:rgba(66,133,244,.38);border-radius:2px;pointer-events:none}
.lp-hint{position:fixed;z-index:6;background:var(--accent-soft);outline:2px solid var(--accent);border-radius:3px;pointer-events:none;animation:fade .12s}
#pop{position:fixed;z-index:31;width:min(380px,calc(100vw - 24px));max-height:min(52vh,460px);display:flex;flex-direction:column;background:var(--r-panel);color:var(--r-fg);border:1px solid var(--r-rule);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.28);animation:fade .15s;box-sizing:border-box}
#pop[data-side]::before{content:"";position:absolute;top:calc(var(--ay,40px) - 8px);width:15px;height:15px;background:var(--r-panel);border:1px solid var(--r-rule);transform:rotate(45deg)}
#pop[data-side="right"]::before{left:-8.5px;border-top-color:transparent;border-right-color:transparent}
#pop[data-side="left"]::before{right:-8.5px;border-bottom-color:transparent;border-left-color:transparent}
#pop:not([data-side])::before{display:none}
#popBody #memoText{min-height:120px}
#pop .pop-head{display:flex;align-items:center;gap:6px;padding:8px 8px 6px 16px;border-bottom:1px solid var(--r-rule)}
#pop .pop-head b{flex:1;font-size:13px;font-weight:600;color:var(--r-muted)}
#pop .pop-head button{width:32px;height:32px;border:0;background:none;color:var(--r-fg);border-radius:8px;cursor:pointer;font-size:18px;line-height:1}
#pop .pop-head button:hover{background:color-mix(in srgb,var(--r-fg) 8%,transparent)}
#popBody{overflow-y:auto;padding:12px 16px 14px;overscroll-behavior:contain}
#popBody .tool-quote{-webkit-line-clamp:2;font-size:13.5px;margin-top:0}
#popBody .tr-out{font-size:15px;padding:10px 12px}
#popBody .seg button{padding:7px 6px;font-size:13px}
#popBody .tool-sub{margin-top:14px}
#popBody .dict-word{font-size:20px}
#popBody .dict-lang{margin:10px 0 2px} #popBody .dict-pos{margin:2px 0 4px} #popBody .dict-defs{font-size:14.5px}
#extbar{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;align-items:center;gap:4px;padding:5px 5px 5px 16px;border-radius:999px;background:var(--r-fg);color:var(--r-bg);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px;white-space:nowrap;max-width:calc(100% - 24px);animation:fade .2s}
#extbar span{overflow:hidden;text-overflow:ellipsis}
#extbar button{border:0;background:color-mix(in srgb,var(--r-bg) 14%,transparent);color:inherit;cursor:pointer;height:34px;border-radius:999px;padding:0 14px;font-size:13px;flex:none}
.dot.c-yellow{background:#F5C22E} .dot.c-green{background:#4FB86C} .dot.c-blue{background:#4E8BF5} .dot.c-pink{background:#F0628E} .dot.c-purple{background:#9B6BF0} .dot.c-orange{background:#F2913A}
#selbar button[aria-pressed="true"] .dot,#selbar button[aria-pressed="true"] .ul-ico{box-shadow:0 0 0 2px var(--r-fg),0 0 0 4px var(--r-bg)}
.dot.picker{position:relative}
.dot.picker::after{content:"";position:absolute;right:-4px;bottom:-4px;width:10px;height:10px;border-radius:50%;background:conic-gradient(#F0628E,#F2913A,#F5C22E,#4FB86C,#4E8BF5,#9B6BF0,#F0628E);border:1.5px solid var(--r-fg)}
.ul-ico{display:block;width:22px;height:22px;line-height:20px;border-radius:5px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:15px;text-decoration:underline;text-decoration-color:var(--ul-red);text-decoration-thickness:2.5px;text-underline-offset:3px}

.tool-quote{margin:4px 0 12px;padding-left:12px;border-left:3px solid var(--accent);font-family:var(--r-font);line-height:1.6;color:var(--r-muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tr-out{font-size:16px;line-height:1.75;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--r-fg) 5%,transparent);white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word;min-height:3em}
.tr-out.loading{color:var(--r-muted)}
.tool-src{font-size:12px;color:var(--r-muted);margin:8px 0 0;line-height:1.5}
.tool-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tool-acts button,.tool-acts a{border:1px solid var(--r-rule);background:transparent;color:var(--r-fg);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.tool-acts a::after{content:"↗";font-size:11px;color:var(--r-muted)}
.tool-sub{font-size:12.5px;color:var(--r-muted);font-weight:500;margin:20px 0 0}
.dict-word{font-family:var(--r-font);font-size:24px;font-weight:700;margin:2px 0 4px}
.dict-lang{font-size:12px;color:var(--r-muted);font-weight:500;letter-spacing:.04em;margin:16px 0 6px}
.dict-pos{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;margin:10px 0 6px}
.dict-defs{margin:0;padding-left:1.3em;font-size:15px;line-height:1.65}
.dict-defs li{margin:.25em 0}
.dict-defs small{display:block;color:var(--r-muted);font-family:var(--r-font);font-size:13.5px}
#toast{position:fixed;#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<section id="library" aria-label="서재">
  <aside id="side" aria-label="서재 메뉴">
    <div class="brand"><span class="mark" aria-hidden="true"></span>My Library</div>
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="libQ" type="search" placeholder="제목, 저자 검색" autocomplete="off"></label>
    <p class="side-h">서재</p>
    <button class="side-item" data-view="all"><svg viewBox="0 0 24 24"><path d="M4 4.5h3v15H4zM9 4.5h3v15H9zM14.2 5.2l2.9-.8 3.9 14.5-2.9.8z"/></svg><span class="lbl">전체</span><span class="n" id="nAll"></span></button>
    <button class="side-item" data-view="reading"><svg viewBox="0 0 24 24"><path d="M3 5.5c3-1 6-1 9 1 3-2 6-2 9-1v13c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6.5v13"/></svg><span class="lbl">읽는 중</span><span class="n" id="nReading"></span></button>
    <button class="side-item" data-view="done"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.3l2.7 2.7L16 9.6"/></svg><span class="lbl">다 읽음</span><span class="n" id="nDone"></span></button>
    <button class="side-item" data-view="marked"><svg viewBox="0 0 24 24"><path d="M5 19.5h14"/><path d="M14.5 4.5l4 4L9 18H5v-4z"/></svg><span class="lbl">표시한 책</span><span class="n" id="nMarked"></span></button>
    <button class="side-item" data-view="pdf"><svg viewBox="0 0 24 24"><path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4"/><path d="M9.5 13h5M9.5 16h5"/></svg><span class="lbl">PDF</span><span class="n" id="nPdf"></span></button>
    <p class="side-h">나의 컬렉션</p>
    <div id="colList"></div>
    <button class="side-item add" id="newCol" data-newcol><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">새 컬렉션</span></button>
    <div class="side-foot">
      <button class="drive-chip" id="driveBtn"><span class="dot"></span><span id="driveTxt">Google Drive 연결</span></button>
      <button class="btn" id="addBtn" hidden><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>파일 추가</button>
      <button class="btn" id="installBtn" hidden>앱으로 설치</button>
      <span class="ver" id="appVer"></span>
      <input type="file" id="fileIn" multiple accept=".epub,.txt,.pdf,application/epub+zip,text/plain,application/pdf" hidden>
    </div>
  </aside>
  <div id="sideScrim"></div>
  <main id="libMain">
    <header class="main-head">
      <button id="sideToggle" aria-label="서재 메뉴"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="viewTitle">전체</h1><span id="count"></span>
      <div class="acts" id="viewActs"></div>
    </header>
    <div id="continue"></div>
    <div id="grid"></div>
    <p class="hint" id="libHint"></p>
  </main>
</section>
<div id="drop" hidden>여기에 놓으면 서재에 추가돼요</div>
<dialog class="lib-dlg" id="libDlg"></dialog>

<section id="reader" hidden aria-label="책 읽기">
  <div id="stage">
    <div id="running"><span id="runTitle"></span></div>
    <div id="page"><div id="content"></div></div>
    <div id="foot"><span id="footLeft"></span><span id="footRight"></span></div>
  </div>
  <div id="ribbon" hidden></div>

  <header id="topbar" class="chrome">
    <button class="ib" id="backBtn" aria-label="서재로"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="tb-title"><b id="tbTitle"></b><span id="tbAuthor"></span></div>
    <button class="ib" data-sheet="toc" aria-label="목차"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <button class="ib" data-sheet="search" aria-label="찾기"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= storage (IndexedDB, memory fallback) ================= */
const store = (() => {
  const mem = { books: new Map(), files: new Map(), state: new Map() };
  let dbp;
  const open = () => dbp || (dbp = new Promise(res => {
    try {
      const rq = indexedDB.open('yeobaek', 1);
      rq.onupgradeneeded = () => ['books', 'files', 'state'].forEach(n => rq.result.objectStoreNames.contains(n) || rq.result.createObjectStore(n));
      rq.onsuccess = () => res(rq.result);
      rq.onerror = rq.onblocked = () => res(null);
    } catch { res(null); }
  }));
  const run = (d, name, mode, fn) => new Promise(res => {
    try {
      const t = d.transaction(name, mode); const r = fn(t.objectStore(name));
      t.oncomplete = () => res(r.result); t.onerror = t.onabort = () => res(undefined);
    } catch { res(undefined); }
  });
  return {
    async get(n, k) { const d = await open(); return d ? run(d, n, 'readonly', os => os.get(k)) : mem[n].get(k); },
    async put(n, k, v) { const d = await open(); if (!d) { mem[n].set(k, v); return; } return run(d, n, 'readwrite', os => os.put(v, k)); },
    async del(n, k) { const d = await open(); if (!d) { mem[n].delete(k); return; } return run(d, n, 'readwrite', os => os.delete(k)); },
    async all(n) { const d = await open(); return d ? (await run(d, n, 'readonly', os => os.getAll())) || [] : [...mem[n].values()]; },
    async entries(n) {
      const d = await open(); if (!d) return [...mem[n].entries()];
      return new Promise(res => {
        try {
          const os = d.transaction(n, 'readonly').objectStore(n), k = os.getAllKeys(), v = os.getAll();
          v.onsuccess = () => res(k.result.map((key, i) => [key, v.result[i]]));
          v.onerror = () => res([]);
        } catch { res([]); }
      });
    },
  };
})();
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* ================= helpers ================= */
const BLOCK_SEL = 'p,h1,h2,h3,h4,h5,h6,li,blockquote,pre,figcaption,dt,dd,td,th,caption';
function getBlocks(root) {
  const cand = $$(BLOCK_SEL + ',div', root).filter(el =>
    el.localName !== 'div' || [...el.childNodes].some(n => n.nodeType === 3 && n.nodeValue.trim()));
  const set = new Set(cand);
  return cand.filter(el => !$$(BLOCK_SEL + ',div', el).some(o => set.has(o)));
}
const BAD = 'script,style,link,meta,iframe,object,embed,form,input,button,textarea,select,base,title,noscript,audio,video';
function sanitize(root) {
  $$(BAD, root).forEach(n => n.remove());
  const w = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
  for (let el = w.nextNode(); el; el = w.nextNode()) {
    for (const a of [...el.attributes]) {
      const n = a.name.toLowerCase();
      if (n.startsWith('on') || n === 'style') el.removeAttribute(a.name);
      else if (/href|src/.test(n) && /^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name);
    }
  }
}
const dir = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
function resolve(base, rel) {
  rel = (rel || '').split('#')[0];
  try { rel = decodeURIComponent(rel); } catch {}
  const parts = (rel.startsWith('/') ? rel.slice(1) : base + rel).split('/'), out = [];
  for (const s of parts) { if (s === '..') out.pop(); else if (s !== '.') out.push(s); }
  return out.join('/');
}
function parseDoc(s) {
  let d = new DOMParser().parseFromString(s, 'application/xhtml+xml');
  if (d.getElementsByTagName('parsererror').length) d = new DOMParser().parseFromString(s, 'text/html');
  return d;
}
const MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp' };
const guessMime = p => MIME[(p.split('.').pop() || '').toLowerCase()] || 'application/octet-stream';
function fmtMin(chars) {
  const m = Math.ceil(chars / S.cpm);
  if (m <= 1) return '1분 미만';
  return m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간${m % 60 ? ' ' + (m % 60) + '분' : ''}`;
}
function toast(msg, action) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('has-act', !!action);
  if (action) {
    const b = Object.assign(document.createElement('button'), { className: 'toast-act', textContent: action.label });
    b.onclick = () => { t.classList.remove('show'); action.fn(); };
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), action ? 7000 : 2600);
}
function copyText(text) {
  if (!text) return;
  try { navigator.clipboard.writeText(text).then(() => toast('복사했어요'), () => toast('이 화면에서는 복사가 막혀 있어요. 직접 선택해 복사해 주세요.')); }
  catch { toast('이 화면에서는 복사가 막혀 있어요. 직접 선택해 복사해 주세요.'); }
}

/* ================= book loaders ================= */
async function loadEpub(buf) {
  if (!window.JSZip) throw new Error('JSZip을 불러오지 못했어요');
  const zip = await JSZip.loadAsync(buf);
  const file = p => zip.file(p) || zip.file(decodeURIComponent(p));
  const readText = p => { const f = p && file(p); return f ? f.async('string') : Promise.resolve(null); };
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const byTag = (d, local) => [...d.getElementsByTagNameNS('*', local)];

  const container = await readText('META-INF/container.xml');
  if (!container) throw new Error('EPUB 구조(container.xml)를 찾을 수 없어요');
  const opfPath = xml(container).querySelector('rootfile')?.getAttribute('full-path');
  const opf = xml(await readText(opfPath) || '<x/>');
  const base = dir(opfPath || '');
  const title = byTag(opf, 'title')[0]?.textContent.trim() || '제목 없음';
  const author = byTag(opf, 'creator').map(n => n.textContent.trim()).filter(Boolean).join(', ');
  const lang = (byTag(opf, 'language')[0]?.textContent || '').trim().toLowerCase().slice(0, 2);
  const manifest = new Map();
  byTag(opf, 'item').forEach(it => manifest.set(it.getAttribute('id'), {
    href: resolve(base, it.getAttribute('href')), type: it.getAttribute('media-type') || '', props: (it.getAttribute('properties') || '').split(/\s+/),
  }));
  const chapters = byTag(opf, 'itemref').map(r => manifest.get(r.getAttribute('idref')))
    .filter(m => m && (/html|xml/.test(m.type) || /\.x?html?$/i.test(m.href))).map(m => ({ path: m.href }));
  if (!chapters.length) throw new Error('읽을 수 있는 본문이 없어요');
  const pathIndex = new Map(chapters.map((c, i) => [c.path, i]));
  const target = (from, href) => {
    if (href == null) return null;
    const [p, frag] = href.split('#');
    const ch = pathIndex.get(p ? resolve(dir(from), p) : from);
    return ch == null ? null : { ch, frag };
  };

  // cover
  let coverItem = [...manifest.values()].find(m => m.props.includes('cover-image'));
  if (!coverItem) { const id = byTag(opf, 'meta').find(m => m.getAttribute('name') === 'cover')?.getAttribute('content'); if (id) coverItem = manifest.get(id); }
  if (!coverItem) coverItem = [...manifest.values()].find(m => /^image\//.test(m.type) && /cover/i.test(m.href));

  // table of contents: EPUB3 nav, then NCX
  const toc = [];
  const nav = [...manifest.values()].find(m => m.props.includes('nav'));
  if (nav) {
    const s = await readText(nav.href);
    if (s) {
      const d = parseDoc(s), navs = [...d.getElementsByTagName('nav')];
      const navEl = navs.find(n => /toc/.test(n.getAttribute('epub:type') || n.getAttributeNS('http://www.idpf.org/2007/ops', 'type') || '')) || navs[0];
      const walk = (ol, depth) => {
        for (const li of [...ol.children].filter(c => c.localName === 'li')) {
          const a = [...li.children].find(c => c.localName === 'a' || c.localName === 'span');
          if (a) { const t = target(nav.href, a.getAttribute('href')); toc.push({ label: a.textContent.trim().replace(/\s+/g, ' '), ch: t ? t.ch : -1, frag: t?.frag, depth }); }
          const sub = [...li.children].find(c => c.localName === 'ol'); if (sub) walk(sub, depth + 1);
        }
      };
      const ol = navEl && ([...navEl.children].find(c => c.localName === 'ol') || navEl.getElementsByTagName('ol')[0]);
      if (ol) walk(ol, 0);
    }
  }
  if (!toc.length) {
    const spine = byTag(opf, 'spine')[0];
    const ncx = manifest.get(spine?.getAttribute('toc')) || [...manifest.values()].find(m => /ncx/.test(m.type));
    const s = ncx && await readText(ncx.href);
    if (s) {
      const walk = (parent, depth) => {
        for (const np of [...parent.children].filter(c => c.localName === 'navPoint')) {
          const label = byTag(np, 'text')[0]?.textContent.trim() || '';
          const src = [...np.children].find(c => c.localName === 'content')?.getAttribute('src');
          const t = target(ncx.href, src);
          toc.push({ label, ch: t ? t.ch : -1, frag: t?.frag, depth });
          walk(np, depth + 1);
        }
      };
      const navMap = byTag(xml(s), 'navMap')[0]; if (navMap) walk(navMap, 0);
    }
  }

  const urls = new Map();
  async function assetUrl(p) {
    if (urls.has(p)) return urls.get(p);
    const f = file(p); if (!f) return null;
    const type = [...manifest.values()].find(m => m.href === p)?.type || guessMime(p);
    const u = URL.createObjectURL(new Blob([await f.async('uint8array')], { type }));
    urls.set(p, u); return u;
  }
  async function getDoc(i) {
    const path = chapters[i].path, wrap = document.createElement('div');
    const s = await readText(path); if (!s) return wrap;
    const d = parseDoc(s), body = d.body || d.getElementsByTagName('body')[0] || d.documentElement;
    for (const n of [...body.childNodes]) wrap.appendChild(document.importNode(n, true));
    sanitize(wrap);
    $$('a[href]', wrap).forEach(a => {
      const h = a.getAttribute('href');
      if (/^[a-z][a-z0-9+.-]*:/i.test(h)) { a.target = '_blank'; a.rel = 'noopener'; return; }
      const t = target(path, h); if (t) { a.dataset.ch = t.ch; if (t.frag) a.dataset.frag = t.frag; }
      a.setAttribute('href', '#');
    });
    return wrap;
  }
  async function getHTML(i) {
    const wrap = await getDoc(i), d = dir(chapters[i].path);
    await Promise.all($$('img[src]', wrap).map(async img => { const u = await assetUrl(resolve(d, img.getAttribute('src'))); u ? img.src = u : img.remove(); }));
    await Promise.all([...wrap.getElementsByTagNameNS('http://www.w3.org/2000/svg', 'image')].map(async im => {
      const h = im.getAttribute('href') || im.getAttributeNS('http://www.w3.org/1999/xlink', 'href'); if (!h) return;
      const u = await assetUrl(resolve(d, h)); if (u) { im.setAttribute('href', u); im.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', u); }
    }));
    return wrap;
  }
  async function coverData() {
    const f = coverItem && file(coverItem.href); if (!f) return null;
    return { buf: await f.async('arraybuffer'), type: coverItem.type || guessMime(coverItem.href) };
  }
  return { title, author, lang, chapters, toc, getDoc, getHTML, coverData };
}

function decodeText(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { try { return new TextDecoder('euc-kr').decode(buf); } catch { return new TextDecoder().decode(buf); } }
}
function loadTxt(buf, name) {
  const lines = decodeText(buf).replace(/^﻿/, '').replace(/\r\n?/g, '\n').split('\n');
  const HEAD = /^\s*(제\s*[0-9一二三四五六七八九十百]+\s*[장화부편권]|chapter\s+[0-9ivxlc]+|프롤로그|에필로그|prologue|epilogue)/i;
  let chunks = [], cur = { title: null, lines: [] };
  for (const ln of lines) {
    if (ln.trim().length < 40 && HEAD.test(ln)) { if (cur.title || cur.lines.some(l => l.trim())) chunks.push(cur); cur = { title: ln.trim(), lines: [] }; }
    else cur.lines.push(ln);
  }
  chunks.push(cur);
  if (chunks.length < 2) { // no headings: split into ~10k-char parts
    chunks = []; let acc = [], n = 0;
    for (const ln of lines) { acc.push(ln); n += ln.length; if (n > 10000) { chunks.push({ title: null, lines: acc }); acc = []; n = 0; } }
    if (acc.some(l => l.trim()) || !chunks.length) chunks.push({ title: null, lines: acc });
  }
  const chapters = chunks.map((c, i) => ({ path: 'txt' + i, title: c.title, html: (c.title ? `<h2>${esc(c.title)}</h2>` : '') + c.lines.filter(l => l.trim()).map(l => `<p>${esc(l.trim())}</p>`).join('') }));
  const getDoc = async i => { const d = document.createElement('div'); d.innerHTML = chapters[i].html; return d; };
  return { title: name, author: '', chapters, toc: chapters.map((c, i) => ({ label: c.title || `${i + 1}번째 부분`, ch: i, depth: 0 })), getDoc, getHTML: getDoc };
}

function placePop() {

  const room = { right: innerWidth - r.right - gap - m, left: r.left - gap - m };
  const side = room.right >= 300 || room.left >= 300 ? (room.right >= room.left ? 'right' : 'left') : null;

  } catch (e) {
    console.warn(e);
    toast(/popup|closed/i.test(e.message) ? '로그인 창이 닫혔어요. 다시 눌러 주세요.' : 'Google Drive에 연결하지 못했어요: ' + e.message);
  }
}
function disconnectDrive() {
  try { if (G.token) google.accounts.oauth2.revoke(G.token.v); } catch {}
  Object.assign(G, { on: false, token: null, err: null });
  ls.set('yb-g-on', false); ls.set('yb-g-tok', null);
  toast('Drive 연결을 해제했어요'); renderLibrary();
}
async function scanDrive() {
  if (G.scanning || !G.on) return;
  G.scanning = true; updateDriveChip();
  try {
    const found = [], queue = [G.fid], seen = new Set();
    while (queue.length) {
      const folder = queue.shift(); if (seen.has(folder)) continue; seen.add(folder);
      let pt = '';
      do {
        const q = encodeURIComponent(`'${folder}' in parents and trashed=false`);
        const r = await gapi(`https://www.googleapis.com/drive/v3/files?q=${q}&pageSize=1000&fields=nextPageToken,files(id,name,mimeType,size,modifiedTime)${pt ? '&pageToken=' + pt : ''}`);
        if (!r.ok) throw new Error(r.status === 404 ? '책 폴더를 찾지 못했어요. 폴더 ID를 확인해 주세요.' : 'Drive 목록을 읽지 못했어요 (' + r.status + ')');
        const j = await r.json();
        for (const f of j.files || []) {
          if (f.mimeType === 'application/vnd.google-apps.folder') queue.push(f.id);
          else if (/\.(epub|txt|pdf)$/i.test(f.name)) found.push({ id: f.id, name: f.name, size: +f.size || 0, modifiedTime: f.modifiedTime });
        }
        pt = j.nextPageToken || '';
      } while (pt);
    }
    G.list = found; G.listAt = Date.now(); G.err = null;
    ls.set('yb-drive-list', { files: found, at: G.listAt });
  } catch (e) { console.warn(e); G.err = e; toast(e.message); }
  finally { G.scanning = false; if (reader.hidden) renderLibrary(); else updateDriveChip(); }
}
async function driveDownload(f, onPct) {
  const r = await gapi(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`);
  if (!r.ok) throw new Error('download ' + r.status);
  const total = +r.headers.get('content-length') || f.size || 0, rd = r.body.getReader(), parts = [];
  let got = 0;
  for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; if (total) onPct(Math.min(1, got / total)); }
  const out = new Uint8Array(got); let o = 0;
  for (const c of parts) { out.set(c, o); o += c.length; }
  return out.buffer;
}

/* --- merging two copies of the reading record --- */
const TOMB_DAYS = 120;
function mergeItems(a, b, tomb) {
  const m = new Map(), t = x => x.mt || x.at || 0;
  for (const x of [...(a || []), ...(b || [])]) { const cur = m.get(x.id); if (!cur || t(x) > t(cur)) m.set(x.id, x); }
  return [...m.values()].filter(x => !(tomb.get(x.id) >= t(x))).sort((p, q) => (p.id < q.id ? -1 : 1));
}
function mergeBook(a, b) {
  if (!a) return b; if (!b) return a;
  const tomb = new Map(), old = Date.now() - TOMB_DAYS * 864e5;
  for (const x of [...(a.tomb || []), ...(b.tomb || [])]) if (x.mt > old && !(tomb.get(x.id) >= x.mt)) tomb.set(x.id, x.mt);
  const pos = (a.locAt || 0) >= (b.locAt || 0) ? a : b, meta = (a.metaAt || 0) >= (b.metaAt || 0) ? a : b;
  return {
    loc: pos.loc, locAt: pos.locAt || 0, progress: pos.progress || 0, total: a.total || b.total || 0,
    lastOpened: Math.max(a.lastOpened || 0, b.lastOpened || 0),
    title: meta.title, author: meta.author, cat: meta.cat, metaAt: meta.metaAt || 0, legacyDone: a.legacyDone || b.legacyDone || undefined,
    highlights: mergeItems(a.highlights, b.highlights, tomb), bookmarks: mergeItems(a.bookmarks, b.bookmarks, tomb),
    tomb: [...tomb].map(([id, mt]) => ({ id, mt })).sort((p, q) => (p.id < q.id ? -1 : 1)),
  };
}
function mergeAll(x, y) {
  const books = {};
  for (const k of new Set([...Object.keys(x.books || {}), ...Object.keys(y.books || {})])) books[k] = mergeBook(x.books?.[k], y.books?.[k]);
  return { books };
}
let syncT;
function queueSync() { if (!G.on) return; clearTimeout(syncT); syncT = setTimeout(syncNow, 4000); }
function syncNow() {
  if (!G.on) return Promise.resolve();
  if (G.syncing) return G.syncing;
  G.syncing = (async () => {
    updateDriveChip();
    try {
      const local = {};
      for (const [k, v] of await store.entries('state')) if (isDrive(k) && v) local[k] = v;
      const q = encodeURIComponent(`name='${SYNC_FILE}'`);
      const lr = await gapi(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime desc`);
      if (!lr.ok) throw new Error('sync list ' + lr.status);
      const files = (await lr.json()).files || [];
      let remote = { books: {} }, rcols = null;
      for (const f of files) {
        const r = await gapi(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`);
        if (r.ok) { try { const j = await r.json(); remote = mergeAll(remote, j); if (j.cols && (!rcols || j.cols.at > rcols.at)) rcols = j.cols; } catch {} }
      }
      const merged = mergeAll({ books: local }, remote);
      for (const [k, v] of Object.entries(merged.books)) {
        if (canon(v) === canon(local[k] ? mergeBook(local[k], local[k]) : null)) continue;
        await store.put('state', k, v);
        if (R.book && R.id === k) applyRemoteState(v);
      }
      if (rcols && rcols.at > COLS.at) { Object.assign(COLS, rcols); ls.set('yb-cols', COLS); if (reader.hidden) renderLibrary(); }
      if (!files.length || canon(merged.books) !== canon(remote.books) || (!rcols ? COLS.at > 0 : COLS.at > rcols.at)) {
        const blob = new Blob([JSON.stringify({ v: 1, updated: Date.now(), books: merged.books, cols: COLS.at ? COLS : undefined })], { type: 'application/json' });
        let w;
        if (files[0]) w = await gapi(`https://www.googleapis.com/upload/drive/v3/files/${files[0].id}?uploadType=media`, { method: 'PATCH', body: blob });
        else {
          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify({ name: SYNC_FILE, parents: ['appDataFolder'] })], { type: 'application/json' }));
          form.append('file', blob);
          w = await gapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', body: form });
        }
        if (!w.ok) throw new Error('sync write ' + w.status);
        for (const f of files.slice(1)) gapi(`https://www.googleapis.com/drive/v3/files/${f.id}`, { method: 'DELETE' }).catch(() => {});
      }
      G.lastSync = Date.now(); ls.set('yb-g-sync', G.lastSync); G.err = null;
    } catch (e) { console.warn('sync failed', e); G.err = e; }
    finally { G.syncing = null; updateDriveChip(); }
  })();
  return G.syncing;
}
// another device changed the open book: take its highlights now, offer its reading position
function applyRemoteState(v) {
  const mine = R.st;
  const marksChanged = canon([mine.highlights, mine.bookmarks]) !== canon([v.highlights, v.bookmarks]);
  const ahead = (v.locAt || 0) > (mine.locAt || 0) && v.loc && (v.loc.ch !== mine.loc?.ch || v.loc.block !== mine.loc?.block);
  R.st = { ...v, loc: mine.loc, locAt: mine.locAt };
  if (marksChanged && !hdrag && !R.ext) renderChapter(R.ch, { block: R.anchor ?? currentAnchor() }, false);
  if (ahead) toast('다른 기기에서 읽던 곳이 있어요', { label: '그곳으로', fn: () => { R.st.loc = v.loc; R.st.locAt = v.locAt; renderChapter(v.loc.ch, { block: v.loc.block }); } });
}
function updateDriveChip() {
  const b = $('#driveBtn'), t = $('#driveTxt'); if (!b) return;
  b.classList.remove('ok', 'busy', 'err');
  if (!G.on) { t.textContent = 'Google Drive 연결'; return; }
  if (G.syncing || G.scanning) { b.classList.add('busy'); t.textContent = G.scanning ? '책 폴더 읽는 중…' : '맞추는 중…'; return; }
  if (G.err) { b.classList.add('err'); t.textContent = '다시 연결'; return; }
  b.classList.add('ok');
  const m = G.lastSync ? Math.round((Date.now() - G.lastSync) / 60000) : null;
  t.textContent = m == null ? 'Drive 연결됨' : m < 1 ? '방금 맞춤' : m < 60 ? `${m}분 전 맞춤` : 'Drive 연결됨';
}
$('#driveBtn').onclick = () => {
  if (!G.on || (G.err && /token|popup|401|interaction|consent|access_denied/i.test(G.err.message))) return connectDrive();
  openDriveDialog();
};
function openDriveDialog() {
  const dlg = $('#libDlg');
  const n = G.list.filter(f => /\.(epub|txt|pdf)$/i.test(f.name)).length;
  dlg.innerHTML = `<form method="dialog">
    <h2>Google Drive</h2>
    <p class="sub">책 폴더에서 EPUB·PDF·TXT ${n}권을 찾았어요.${G.lastSync ? ' 마지막으로 맞춘 때: ' + new Date(G.lastSync).toLocaleString('ko-KR') : ''}${G.err ? '<br>최근 오류: ' + esc(G.err.message) : ''}</p>
    <label>책 폴더 ID<input id="gFid" value="${esc(G.fid)}" spellcheck="false" autocomplete="off">
      <small>Drive에서 책 폴더를 열었을 때 주소의 <b>folders/</b> 뒤에 오는 글자예요. 하위 폴더까지 모두 찾아요.</small></label>
    <details><summary>고급 설정</summary><label>OAuth 클라이언트 ID<input id="gCid" value="${esc(G.cid)}" spellcheck="false" autocomplete="off"></label>
      <label>사전 중계 주소 (Apps Script)<input id="gRelay" value="${esc(RELAY.url)}" spellcheck="false" autocomplete="off">
      <small>표준국어대사전·Merriam-Webster 사전과 번역에 써요.</small></label></details>
    <div class="dlg-acts">
      <button class="btn left" value="off">연결 해제</button>
      <button class="btn" value="sync">지금 맞추기</button>
      <button class="btn primary" value="save">저장하고 다시 읽기</button>
    </div></form>`;
  dlg.onclose = async () => {
    const v = dlg.returnValue;
    if (v === 'off') disconnectDrive();
    else if (v === 'sync') { await syncNow(); await scanDrive(); toast(G.err ? '맞추지 못했어요: ' + G.err.message : '다른 기기와 맞췄어요'); }
    else if (v === 'save') {
      const fid = $('#gFid').value.trim().replace(/^.*folders\//, '').replace(/[?#].*$/, ''), cid = $('#gCid').value.trim();
      const relay = $('#gRelay').value.trim(); if (relay !== RELAY.url) { RELAY.url = relay; RELAY.tr = null; ls.set('yb-relay', relay); ls.set('yb-relay-tr-at', 0); }
      if (cid && cid !== G.cid) { G.cid = cid; ls.set('yb-g-cid', cid); G.client = null; G.token = null; }
      if (fid) { G.fid = fid; ls.set('yb-g-fid', fid); }
      await scanDrive();
    }
  };
  dlg.showModal();
}
// keep devices in step: push when leaving, pull when coming back
document.addEventListener('visibilitychange', () => {
  if (!G.on) return;
  if (document.visibilityState === 'hidden') { if (R.book) saveNow(); syncNow(); }
  else { syncNow().then(() => { if (reader.hidden) renderLibrary(); }); if (Date.now() - G.listAt > 5 * 60000) scanDrive(); }
});
setInterval(() => { if (G.on && document.visibilityState === 'visible') { updateDriveChip(); if (R.book && isDrive(R.id)) syncNow(); } }, 60000);

/* --- file names: "Title -- Author -- z-lib.org.epub" and friends --- */
const JUNK = [/^[0-9a-f]{32}$/i, /^[0-9a-f]{40}$/i, /anna\s*['’`]?\s*s?\s*archive/i, /z[-\s]?lib(rary)?/i, /libgen|library\s*genesis/i,
  /oceanofpdf|epubshare|bookfi|b-ok\b/i, /^[\d][\d\s\-xX]{8,19}$/, /^[a-z0-9][a-z0-9-]*\.(com|org|net|io|ru|se|is|to|cc)$/i,
  /^(epub|pdf|mobi|azw3|retail|scan|ocr|calibre|v\d+(\.\d+)?)$/i];
const isJunk = s => { const t = (s || '').trim(); return !t || JUNK.some(r => r.test(t)); };
const tidySeg = s => (s || '').replace(/\s*\[[^\]]*\]\s*/g, ' ').replace(/\s*[(（][^)）]*(z-?lib|anna|archive|oceanof|libgen)[^)）]*[)）]/ig, '')
  .replace(/\s{2,}/g, ' ').replace(/^[\s,;·・]+|[\s,;·・-]+$/g, '').trim();
function guessMeta(filename) {
  let base = filename.replace(/\.(epub|pdf|txt)$/i, '').trim()
    .replace(/^\d{1,3}\s*[.\-_)\]]\s*/, '').replace(/_+/g, ' ').replace(/\s{2,}/g, ' ').trim()
    .replace(/\s*[(（\[][^)）\]]*(z-?lib|anna\s*['’`]?\s*s?\s*archive|oceanof|libgen|b-ok)[^)）\]]*[)）\]]/ig, '').trim();
  let title = base, author = '', m;
  if (/\s*--\s*/.test(base)) {
    const segs = base.split(/\s*--\s*/).map(tidySeg).filter(x => x && !isJunk(x));
    if (segs.length) { title = segs[0]; author = segs[1] || ''; }
  } else {
    if ((m = base.match(/^\[([^\]]{1,30})\]\s*(.+)$/))) { author = m[1]; title = m[2]; }
    else if ((m = base.match(/^(.+?)\s+[-–—]\s+(.+)$/))) {
      const a = m[1].trim(), b = m[2].trim();
      if (a.length <= 22 && b.length >= a.length) { author = a; title = b; } else { title = a; author = b.length <= 22 ? b : ''; }
    } else if ((m = base.match(/^(.+?)\s*[(（]([^)）]{2,25})[)）]\s*$/)) && !/판|쇄|권|vol|edition|개정/i.test(m[2])) { title = m[1].trim(); author = m[2].trim(); }
    title = tidySeg(title); author = tidySeg(author);
  }
  if (isJunk(author)) author = '';
  return { title: title.trim() || base, author: author.trim() };
}

/* ================= device niceties ================= */
let wake = null;
async function requestWake() { try { wake = await navigator.wakeLock?.request('screen'); } catch {} }
function releaseWake() { try { wake?.release(); } catch {} wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (R.book) requestWake(); } else saveNow(); });
addEventListener('pagehide', saveNow);

let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').hidden = false; });
$('#installBtn').onclick = async () => { if (!installEvt) return; installEvt.prompt(); installEvt = null; $('#installBtn').hidden = true; };
if ('launchQueue' in window) launchQueue.setConsumer(async p => { if (p.files?.length) importFiles(await Promise.all(p.files.map(h => h.getFile()))); });
(async () => {
  try {
    if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
    const r = await fetch('sw.js', { method: 'HEAD', cache: 'no-store' });
    if (r.ok) navigator.serviceWorker.register('sw.js');
  } catch {}
})();

// the installed app's title bar takes this colour: match whatever screen is showing
function syncThemeColor() {
  const el = reader.hidden ? document.body : reader;
  const c = getComputedStyle(el).backgroundColor;
  const [r, g, b] = (getComputedStyle(reader).backgroundColor.match(/\d+(\.\d+)?/g) || [255, 255, 255]).map(Number);
  reader.classList.toggle('darkpage', 0.2126 * r + 0.7152 * g + 0.0722 * b < 110); // dark page → solid highlighter colours
  const m = $('#themeColor'); if (m && c) m.setAttribute('content', c);
}
new MutationObserver(syncThemeColor).observe(reader, { attributes: true, attributeFilter: ['hidden', 'data-rt'] });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(syncThemeColor, 50));
const APP_VERSION = 'v8';
$('#appVer').textContent = 'My Library ' + APP_VERSION;
// reopen the book that was open (a reload or Android closing the app in the background lands back in it).
// The flag is cleared first and set again once the book opens, so a missing book isn't retried forever.
renderLibrary().then(() => { const o = ls.get('yb-open', null); if (o && reader.hidden) { ls.set('yb-open', null); openBook(o); } });
syncThemeColor();
loadGIS().catch(() => {}); // ready before the first tap, so the sign-in popup isn't blocked
if (G.on) syncNow().then(() => { renderLibrary(); if (Date.now() - G.listAt > 5 * 60000) scanDrive(); fetchLegacy(); });
</script>
